# Permission for building the diagnostics text snapshot from the settings window.

[[permission]]
identifier = "allow-settings-diagnostics"
description = "Enables the settings_diagnostics command without any pre-configured scope."
commands.allow = ["settings_diagnostics"]

[[permission]]
identifier = "deny-settings-diagnostics"
description = "Denies the settings_diagnostics command."
commands.deny = ["settings_diagnostics"]
