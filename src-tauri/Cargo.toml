[package]
name = "lalin-cast"
version = "0.2.0"
description = "Lalin Cast — Rust + Tauri v2 Leanback player"
authors = ["LALIN"]
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "lalin_cast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
httpdate = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_System_Console", "Win32_System_Power"] }
