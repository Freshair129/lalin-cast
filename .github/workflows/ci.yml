name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust (stable, clippy + rustfmt)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: cargo fmt --check
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo clippy
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo check
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: node --check injected.js
        shell: pwsh
        run: node --check src-tauri/injected.js

  smoke:
    name: Lifecycle CLI smoke (debug build)
    # Wave 6 U4 (docs/plans/W6_POLISH_PLAN.md): builds the debug binary and
    # exercises the real `--version` / `--lifecycle close` CLI contract
    # end-to-end on a Windows runner, on top of `checks` passing first.
    # Human gate H20 (docs/plans/W6_POLISH_PLAN.md) is closed: this job ran
    # green on two consecutive pull requests (#9 and #10), so
    # `continue-on-error` has been removed and this job is now blocking.
    needs: checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: cargo build (debug)
        shell: pwsh
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Assert --version output
        shell: pwsh
        run: |
          $cargoToml = Get-Content -Raw -Path src-tauri/Cargo.toml
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not parse [package].version from src-tauri/Cargo.toml"
          }
          $version = $Matches[1]
          $exePath = "src-tauri/target/debug/lalin-cast.exe"
          $actual = & $exePath --version
          $expected = "lalin-cast $version"
          if ($actual -ne $expected) {
            Write-Host "Expected: $expected"
            Write-Host "Actual:   $actual"
            throw "lalin-cast.exe --version did not print the expected string"
          }
          Write-Host "OK: $actual"

      - name: Run --lifecycle close --request-id ci-smoke (60s timeout)
        shell: pwsh
        run: |
          $exePath = "src-tauri/target/debug/lalin-cast.exe"
          $proc = Start-Process -FilePath $exePath -ArgumentList "--lifecycle", "close", "--request-id", "ci-smoke" -PassThru
          # WaitForExit (not Wait-Process) so a process that already exited
          # before the wait is not reported as "cannot find process".
          if (-not $proc.WaitForExit(60000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "lalin-cast.exe --lifecycle close --request-id ci-smoke did not exit within 60s"
          }
          Write-Host "exit code: $($proc.ExitCode)"

      - name: Assert lifecycle.json state
        shell: pwsh
        run: |
          $lifecyclePath = Join-Path $env:LOCALAPPDATA "ai.lalin.cast\lifecycle.json"
          if (-not (Test-Path $lifecyclePath)) {
            throw "lifecycle.json not found at $lifecyclePath"
          }
          $state = Get-Content -Raw -Path $lifecyclePath | ConvertFrom-Json
          if ($state.type -ne "stopped" -or $state.requestId -ne "ci-smoke" -or $state.exitCode -ne 0) {
            Write-Host "lifecycle.json contents:"
            Get-Content -Raw -Path $lifecyclePath
            throw "lifecycle.json did not match the expected stopped/ci-smoke/exitCode=0 state"
          }
          Write-Host "OK: lifecycle.json matched the expected stopped/ci-smoke/exitCode=0 state"

      - name: Print lifecycle.json on failure
        if: failure()
        shell: pwsh
        run: |
          $lifecyclePath = Join-Path $env:LOCALAPPDATA "ai.lalin.cast\lifecycle.json"
          if (Test-Path $lifecyclePath) {
            Write-Host "lifecycle.json contents:"
            Get-Content -Raw -Path $lifecyclePath
          } else {
            Write-Host "lifecycle.json does not exist at $lifecyclePath"
          }

  arm64-check:
    name: ARM64 cross-compile check (experimental)
    # Wave 4 U4 (docs/plans/W4_PLAYBACK_PLAN.md): confirms the ARM64 target
    # keeps compiling as the codebase changes, ahead of the experimental
    # ARM64 leg in release.yml. No ARM64 runner is used or needed — this only
    # type-checks a cross-compile from the x64 host, so it cannot run tests.
    # continue-on-error keeps a real ARM64 regression from blocking PRs/CI
    # while the target has no dedicated runner to verify behavior on.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: rustup target add aarch64-pc-windows-msvc
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: cargo check --target aarch64-pc-windows-msvc
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-pc-windows-msvc

  supply-chain:
    name: Supply-chain audit (cargo-deny)
    # EmbarkStudios/cargo-deny-action is a Docker container action (verified
    # against action.yml at the pinned SHA below: `runs.using: "docker"`),
    # and GitHub Actions only executes Docker container actions on Linux
    # runners — never windows-latest. It must stay in its own ubuntu job,
    # separate from the `checks` (windows-latest) job above, or every CI run
    # fails at this step. See docs/plans/H0_RELEASE_READINESS_PLAN.md (S3).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cargo-deny (licenses, advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check
          command-arguments: licenses advisories bans sources

  notices:
    name: Third-party notices vs. Cargo.lock
    # Wave 9 U3 (docs/plans/W9_SUPPORTABILITY_PLAN.md): tauri-plugin-store
    # 2.4.3 -> 2.4.5 (Dependabot, PR #6) landed on `main` without
    # THIRD_PARTY_NOTICES.md being updated to match, and nothing in CI
    # caught it — it had to be fixed after the fact in a follow-up PR (#12).
    # `supply-chain` above checks license *policy* against Cargo.lock; it
    # has no idea THIRD_PARTY_NOTICES.md exists. This job compares the two
    # files' (name, version) pairs in both directions and is blocking (no
    # `continue-on-error`) so that gap cannot reopen silently. It needs no
    # Rust toolchain, so it stays as fast as `supply-chain`.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: node scripts/check-notices.mjs
        run: node scripts/check-notices.mjs
