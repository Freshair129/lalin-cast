name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Rust (stable, clippy + rustfmt)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: cargo fmt --check
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo clippy
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo check
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: node --check injected.js
        shell: pwsh
        run: node --check src-tauri/injected.js

  supply-chain:
    name: Supply-chain audit (cargo-deny)
    # EmbarkStudios/cargo-deny-action is a Docker container action (verified
    # against action.yml at the pinned SHA below: `runs.using: "docker"`),
    # and GitHub Actions only executes Docker container actions on Linux
    # runners — never windows-latest. It must stay in its own ubuntu job,
    # separate from the `checks` (windows-latest) job above, or every CI run
    # fails at this step. See docs/plans/H0_RELEASE_READINESS_PLAN.md (S3).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: cargo-deny (licenses, advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check
          command-arguments: licenses advisories bans sources
