name: Release dry run (unsigned)

# Wave 10 U2 (docs/plans/W10_RELEASE_REHEARSAL_PLAN.md, contract 1): this repository has never had a
# tag or a release, so `release.yml` has never actually run and the NSIS installer has never been
# built in CI. This workflow rehearses the *build* half of `release.yml` — same pinned
# `tauri-apps/tauri-action`, same checkout, same Rust toolchain, same `projectPath` — on every change
# that could plausibly break the bundle, so a broken installer is caught on a pull request instead of
# the day a `v*` tag is pushed for real.
#
# Wave 12 U2 (docs/plans/W12_RELEASE_ASSETS_PLAN.md, contract 7): the inline installer-scheme check,
# the portable zip staging and the checksum logic below have been replaced with calls into
# `scripts/release/**` (contracts 1-5) — the exact same scripts `release.yml` calls on a real tag —
# so this dry run now proves the packaging code that a real release will run, not a second copy of
# it. `Test-ReleaseVersion.ps1` is run here with a *simulated* tag (`-SkipChangelog`, added to
# contract 1 only for this workflow) because there is no real tag on a pull request; `release.yml`
# must never pass `-SkipChangelog`.
#
# It must NOT create or upload a GitHub Release, must NOT need any secret (no
# LALIN_CAST_TAURI_SIGNING_PRIVATE_KEY), and must NEVER modify `.github/workflows/release.yml` itself
# — rehearsing a script by editing the script would defeat the rehearsal. See the plan for the
# evidence (README + source at the pinned tauri-action SHA) behind the choices below:
#   1. tauri-action locates the Tauri CLI via `hasDependency('@tauri-apps/cli', projectPath)`, which
#      reads `package.json` at `projectPath` (src/utils.ts, src/runner.ts). This repository's root has
#      no `package.json`, so `hasDependency` returns a falsy value, `getRunner()` falls through to
#      `npm install -g @tauri-apps/cli@v2` and returns `new Runner('tauri')` — the action installs the
#      CLI globally via npm and then runs the bare `tauri` binary directly, not `npm run tauri` /
#      `yarn tauri` / etc.
#   2. Per the README ("If you only want to build the app without having the action upload any
#      assets... simply omit `tagName`, `releaseName` and `releaseId`") and confirmed in src/index.ts:
#      when none of `releaseId`/`tagName` end up set, the action logs "No releaseId or tagName
#      provided, skipping all uploads..." and returns without creating or uploading a release. This
#      workflow deliberately omits all three inputs.
#   3. `args` (this action's passthrough to `tauri build`) is tokenized by `string-argv` and parsed
#      with Node's `parseArgs`, which supports repeatable `-c`/`--config <value>` (src/inputs.ts). The
#      parsed `--config` value is passed both into tauri-action's own `getInfo()` (for artifact naming)
#      and straight through to the real `tauri build` invocation, so a `--config` override reaches the
#      Tauri CLI exactly as it would locally.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/icons/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-dryrun.yml"
      - "packaging/portable/**"
      - "scripts/release/**"

permissions:
  contents: read

jobs:
  dry-run:
    name: Build unsigned installer (x64 dry run, no release)
    # x86_64-pc-windows-msvc only — matches release.yml's stable (non-experimental) leg. release.yml's
    # arm64 leg is `experimental: true` and out of scope for this rehearsal (see the plan, "Out of
    # scope / wave 11").
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: rustup target add x86_64-pc-windows-msvc
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Read app version (Test-ReleaseVersion.ps1 -ResolveOnly)
        # Wave 12 U2 (docs/plans/W12_RELEASE_ASSETS_PLAN.md, contract 1): the app version is
        # `version` in src-tauri/tauri.conf.json if present, else `[package].version` in
        # src-tauri/Cargo.toml. Resolved by the script itself (not an inline copy of the rule) before
        # there is any tag, so a simulated `-Tag v<version>` can be built for the guard below.
        id: read-version
        shell: pwsh
        run: scripts/release/Test-ReleaseVersion.ps1 -CargoToml src-tauri/Cargo.toml -TauriConf src-tauri/tauri.conf.json -ResolveOnly

      - name: Guard tag against app version (Test-ReleaseVersion.ps1, simulated tag)
        shell: pwsh
        run: scripts/release/Test-ReleaseVersion.ps1 -Tag "v${{ steps.read-version.outputs.version }}" -CargoToml src-tauri/Cargo.toml -TauriConf src-tauri/tauri.conf.json -Changelog CHANGELOG.md -SkipChangelog

      - name: Build unsigned Tauri bundle (dry run — no release, no updater artifacts)
        # Same tauri-action SHA, same projectPath as release.yml. No `tagName` / `releaseName` /
        # `releaseId` input is set (see evidence #2 above), so the action builds only and never talks
        # to the GitHub Releases API. The `--config` override sets `bundle.createUpdaterArtifacts` to
        # `false` so the build needs no `TAURI_SIGNING_PRIVATE_KEY*` secret at all — this step and this
        # job reference no secret anywhere.
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: .
          args: '--target x86_64-pc-windows-msvc --config {"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify installer scheme (Test-InstallerScheme.ps1)
        # Wave 12 U2: replaces the inline `installer.nsi` check with the shared, fail-closed script
        # (contract 2) so this dry run exercises exactly the code release.yml runs on a real tag.
        shell: pwsh
        run: scripts/release/Test-InstallerScheme.ps1 -SearchRoot src-tauri/target

      - name: Locate the unsigned setup executable
        id: find-installer
        shell: pwsh
        run: |
          $setupFiles = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*-setup.exe" -ErrorAction SilentlyContinue
          if (-not $setupFiles -or $setupFiles.Count -eq 0) {
            throw "No *-setup.exe found under src-tauri/target -- the bundle step did not produce an NSIS installer."
          }

          $setupFile = $setupFiles | Select-Object -First 1
          $sizeBytes = $setupFile.Length
          $sizeMiB = [Math]::Round($sizeBytes / 1MB, 2)

          Write-Host "Installer: $($setupFile.FullName) ($sizeMiB MiB)"

          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$($setupFile.FullName)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "size_bytes=$sizeBytes"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "size_mib=$sizeMiB"

      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lalin-cast-dryrun-installer
          path: ${{ steps.find-installer.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Build the portable zip (New-PortableZip.ps1)
        # Wave 12 U2 (contract 3): replaces the inline staging/Compress-Archive logic with the
        # shared script, which also verifies the zip's own contents after building it.
        id: build-portable-zip
        shell: pwsh
        run: scripts/release/New-PortableZip.ps1 -ExePath "src-tauri/target/x86_64-pc-windows-msvc/release/lalin-cast.exe" -ReadmePath packaging/portable/README-PORTABLE.txt -OutputDir "${{ runner.temp }}" -Version "${{ steps.read-version.outputs.version }}" -Arch x64

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lalin-cast-dryrun-portable
          path: ${{ steps.build-portable-zip.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Write checksums (Write-Checksums.ps1)
        # Wave 12 U2 (contract 4): SHA-256 over the installer and the portable zip together, one
        # file per architecture, in the same `sha256sum`-compatible format release.yml will attach.
        shell: pwsh
        run: scripts/release/Write-Checksums.ps1 -Files "${{ steps.find-installer.outputs.path }}","${{ steps.build-portable-zip.outputs.path }}" -OutputPath "${{ runner.temp }}\Lalin-Cast_${{ steps.read-version.outputs.version }}_x64_SHA256SUMS.txt" -GitHubAssetNames

      - name: Upload checksum artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lalin-cast-dryrun-checksums
          path: ${{ runner.temp }}\Lalin-Cast_${{ steps.read-version.outputs.version }}_x64_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Rehearse asset publish (Publish-ReleaseAssets.ps1 -WhatIf)
        # Wave 12 U2 (contract 5): `-WhatIf` only lists what would be uploaded and verifies every
        # file exists -- it never calls `gh` and needs no token, so this dry run stays secret-free.
        shell: pwsh
        run: scripts/release/Publish-ReleaseAssets.ps1 -Tag "v${{ steps.read-version.outputs.version }}" -Files "${{ steps.build-portable-zip.outputs.path }}","${{ runner.temp }}\Lalin-Cast_${{ steps.read-version.outputs.version }}_x64_SHA256SUMS.txt" -WhatIf

      - name: Write job summary
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Lalin Cast release dry run (unsigned)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Installer size: ``${{ steps.find-installer.outputs.size_mib }} MiB`` (``${{ steps.find-installer.outputs.size_bytes }}`` bytes)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Installer scheme check (Test-InstallerScheme.ps1): ``pass``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **This installer is UNSIGNED** (Authenticode signing is human gate H4, not yet closed) -- do not distribute it as a real release artifact."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Artifact: ``lalin-cast-dryrun-installer`` (retained 7 days) -- use for human gate H28 (install on a clean machine, confirm it launches)."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Portable zip: ``${{ steps.build-portable-zip.outputs.path }}``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **The portable zip's exe is UNSIGNED** (same as the installer above) -- do not distribute it as a real release artifact."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Artifact: ``lalin-cast-dryrun-portable`` (retained 7 days) -- use for human gate H29 (extract to a USB drive on a clean machine, confirm settings persist and no registry/AppData writes happen)."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Checksums (``lalin-cast-dryrun-checksums``): ``Lalin-Cast_${{ steps.read-version.outputs.version }}_x64_SHA256SUMS.txt``, retained 7 days."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Publish-ReleaseAssets.ps1 rehearsed with ``-WhatIf`` -- no upload, no ``gh`` call, no secret used."

  dry-run-arm64:
    name: Build unsigned installer (arm64 dry run, experimental, no release)
    # Wave 11 U3 (docs/plans/W11_PORTABLE_PLAN.md, contract 6): a dry-run rehearsal of release.yml's
    # experimental arm64 leg, which has never actually run in CI (see that file's `arm64-check` job
    # comment). This is a separate top-level job, not a matrix entry sharing state with `dry-run`
    # above -- GitHub Actions does not cancel one independent job because a different independent job
    # fails or is slow, so `continue-on-error: true` here is already enough to keep an arm64 failure
    # from turning this workflow red or blocking the x64 leg, mirroring what release.yml achieves with
    # its matrix's `fail-fast: false` + per-leg `continue-on-error: ${{ matrix.experimental }}`
    # (a arm64 failure there does not cancel or fail the x64 leg either).
    # Wave 12 U2 (docs/plans/W12_RELEASE_ASSETS_PLAN.md, contract 7): this leg now also builds a
    # portable zip and checksums, using the same scripts/release/** scripts as the x64 leg above --
    # wave 11 only did that for x64.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: rustup target add aarch64-pc-windows-msvc
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Read app version (Test-ReleaseVersion.ps1 -ResolveOnly)
        # Identical method to the x64 leg above -- see that step's comment for the full reasoning.
        id: read-version
        shell: pwsh
        run: scripts/release/Test-ReleaseVersion.ps1 -CargoToml src-tauri/Cargo.toml -TauriConf src-tauri/tauri.conf.json -ResolveOnly

      - name: Guard tag against app version (Test-ReleaseVersion.ps1, simulated tag)
        shell: pwsh
        run: scripts/release/Test-ReleaseVersion.ps1 -Tag "v${{ steps.read-version.outputs.version }}" -CargoToml src-tauri/Cargo.toml -TauriConf src-tauri/tauri.conf.json -Changelog CHANGELOG.md -SkipChangelog

      - name: Build unsigned Tauri bundle (dry run -- no release, no updater artifacts)
        # Same pinned tauri-action SHA and same createUpdaterArtifacts=false override as the x64 leg
        # above, plus --target for this leg's triple. See that step's comment for why no
        # TAURI_SIGNING_PRIVATE_KEY* secret is needed and why no release is created or uploaded.
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: .
          args: '--target aarch64-pc-windows-msvc --config {"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify installer scheme (Test-InstallerScheme.ps1)
        # Identical fail-closed scheme check as the x64 leg above (shared script, contract 2) --
        # kept in lockstep so this leg cannot quietly become a weaker rehearsal than the x64 one.
        shell: pwsh
        run: scripts/release/Test-InstallerScheme.ps1 -SearchRoot src-tauri/target

      - name: Locate the unsigned setup executable
        id: find-installer
        shell: pwsh
        run: |
          $setupFiles = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*-setup.exe" -ErrorAction SilentlyContinue
          if (-not $setupFiles -or $setupFiles.Count -eq 0) {
            throw "No *-setup.exe found under src-tauri/target -- the bundle step did not produce an NSIS installer."
          }

          $setupFile = $setupFiles | Select-Object -First 1
          $sizeBytes = $setupFile.Length
          $sizeMiB = [Math]::Round($sizeBytes / 1MB, 2)

          Write-Host "Installer: $($setupFile.FullName) ($sizeMiB MiB)"

          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$($setupFile.FullName)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "size_bytes=$sizeBytes"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "size_mib=$sizeMiB"

      - name: Upload unsigned installer artifact (arm64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lalin-cast-dryrun-installer-arm64
          path: ${{ steps.find-installer.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Build the portable zip (New-PortableZip.ps1)
        # Wave 12 U2 (contract 3): arm64 portable zip, new in this wave (wave 11 only built it for
        # x64). Same shared script as the x64 leg above, -Arch arm64.
        id: build-portable-zip
        shell: pwsh
        run: scripts/release/New-PortableZip.ps1 -ExePath "src-tauri/target/aarch64-pc-windows-msvc/release/lalin-cast.exe" -ReadmePath packaging/portable/README-PORTABLE.txt -OutputDir "${{ runner.temp }}" -Version "${{ steps.read-version.outputs.version }}" -Arch arm64

      - name: Upload portable zip artifact (arm64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lalin-cast-dryrun-portable-arm64
          path: ${{ steps.build-portable-zip.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Write checksums (Write-Checksums.ps1)
        shell: pwsh
        run: scripts/release/Write-Checksums.ps1 -Files "${{ steps.find-installer.outputs.path }}","${{ steps.build-portable-zip.outputs.path }}" -OutputPath "${{ runner.temp }}\Lalin-Cast_${{ steps.read-version.outputs.version }}_arm64_SHA256SUMS.txt" -GitHubAssetNames

      - name: Upload checksum artifact (arm64)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lalin-cast-dryrun-checksums-arm64
          path: ${{ runner.temp }}\Lalin-Cast_${{ steps.read-version.outputs.version }}_arm64_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Rehearse asset publish (Publish-ReleaseAssets.ps1 -WhatIf)
        shell: pwsh
        run: scripts/release/Publish-ReleaseAssets.ps1 -Tag "v${{ steps.read-version.outputs.version }}" -Files "${{ steps.build-portable-zip.outputs.path }}","${{ runner.temp }}\Lalin-Cast_${{ steps.read-version.outputs.version }}_arm64_SHA256SUMS.txt" -WhatIf

      - name: Write job summary
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Lalin Cast release dry run (unsigned, arm64, experimental)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Installer size: ``${{ steps.find-installer.outputs.size_mib }} MiB`` (``${{ steps.find-installer.outputs.size_bytes }}`` bytes)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Installer scheme check (Test-InstallerScheme.ps1): ``pass``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **This installer is UNSIGNED** (Authenticode signing is human gate H4, not yet closed) -- do not distribute it as a real release artifact."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- This is the **experimental arm64** leg (``continue-on-error: true``, mirrors ``release.yml``'s matrix) -- a failure here is reported but does not fail this workflow or block the x64 leg above."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Artifact: ``lalin-cast-dryrun-installer-arm64`` (retained 7 days)."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Portable zip: ``${{ steps.build-portable-zip.outputs.path }}`` -- artifact ``lalin-cast-dryrun-portable-arm64`` (retained 7 days)."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Checksums (``lalin-cast-dryrun-checksums-arm64``): ``Lalin-Cast_${{ steps.read-version.outputs.version }}_arm64_SHA256SUMS.txt``, retained 7 days."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Publish-ReleaseAssets.ps1 rehearsed with ``-WhatIf`` -- no upload, no ``gh`` call, no secret used."
